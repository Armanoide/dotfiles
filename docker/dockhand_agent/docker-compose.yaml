services:
  hawser:
    image: ghcr.io/finsys/hawser:latest
    container_name: dockhand_agent
    restart: unless-stopped
    ports:
      - "2376:2376"
    environment:
      - TOKEN=${TOKEN}
      - AGENT_ID=mac-mini-node
      - LOG_LEVEL=info
      - DOCKHAND_SERVER_URL=${DOCKHAND_SERVER_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/:/data/stacks
