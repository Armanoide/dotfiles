services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    networks:
      - proxy_net
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config:/config
      - ${MOVIES_PATH}:/movies
      - ${DOWNLOAD_PATH}:/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=https"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.tls.certresolver=cloudflare"
      - "traefik.http.routers.radarr.middlewares=radarr-sablier,crowdsec-bouncer@docker"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"

      # Sablier middleware (self-contained)
      - "traefik.http.middlewares.radarr-sablier.plugin.sablier.group=radarr"
      - "traefik.http.middlewares.radarr-sablier.plugin.sablier.sablierUrl=http://sablier:10000"
      - "traefik.http.middlewares.radarr-sablier.plugin.sablier.sessionDuration=5m"
      - "traefik.http.middlewares.radarr-sablier.plugin.sablier.dynamic.displayName=radarr"
      - "traefik.http.middlewares.radarr-sablier.plugin.sablier.dynamic.theme=hacker-terminal"
      - "traefik.http.middlewares.radarr-sablier.plugin.sablier.dynamic.showDetails=true"
      # Sablier discovery
      - "sablier.enable=true"
      - "sablier.group=radarr"



networks:
  proxy_net:
    external: true
