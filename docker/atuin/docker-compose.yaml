services:
  atuin:
    container_name: atuin
    restart: unless-stopped
    image: ghcr.io/atuinsh/atuin:latest
    command: start
    extra_hosts:
      - "atuin.armanoide.net:host-gateway"
    volumes:
      - "./config:/config"
    environment:
      ATUIN_HOST: "0.0.0.0"
      ATUIN_OPEN_REGISTRATION: "true"
      ATUIN_DB_URI: postgres://${ATUIN_DB_USERNAME}:${ATUIN_DB_PASSWORD}@db/${ATUIN_DB_NAME}
      RUST_LOG: debug,atuin_server=debug
    depends_on:
      - db
    networks:
      - proxy_net
      - portabase_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.atuin.rule=Host(`atuin.${DOMAIN}`)"
      - "traefik.http.routers.atuin.entrypoints=https"
      - "traefik.http.routers.atuin.tls=true"
      - "traefik.http.routers.atuin.tls.certresolver=cloudflare"
      - "traefik.http.services.atuin.loadbalancer.server.port=8888"

  db:
    container_name: atuin_db
    image: postgres:18
    restart: unless-stopped
    volumes: # Don't remove permanent storage for index database files!
      - "./db:/var/lib/postgresql/"
    environment:
      POSTGRES_USER: ${ATUIN_DB_USERNAME}
      POSTGRES_PASSWORD: ${ATUIN_DB_PASSWORD}
      POSTGRES_DB: ${ATUIN_DB_NAME}
      TZ: Europe/Paris
      PGTZ: Europe/Paris
    networks:
      - portabase_net

networks:
  proxy_net:
    external: true
  portabase_net:
    external: true
