services:
  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    container_name: spoolman
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ./data:/home/app/.local/share/spoolman
    # ports:
    #   - "7912:8000"
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.spoolman.rule=Host(`spoolman.${DOMAIN}`)"
    #   - "traefik.http.routers.spoolman.entrypoints=https"
    #   - "traefik.http.routers.spoolman.tls=true"
    #   - "traefik.http.routers.spoolman.tls.certresolver=cloudflare"
    #   - "traefik.http.services.spoolman.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      proxy_net:
      vlan60_services:
        ipv4_address: ${SPOOLMAN_IP}

networks:
  proxy_net:
    external: true
  vlan60_services:
    external: true
