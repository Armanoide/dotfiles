[admins]
obsidian = 31a9fb9ed8eb85028910e9048500b84ecfcaf70e9bd8d9e8e7d2e49de37e7ef6

[couchdb]
single_node = true
max_document_size = 50000000

[chttpd]
require_valid_user = true
enable_cors = true
max_http_request_size = 4294967296
WWW-Authenticate = Basic realm="couchdb"

[couchhttpd]
require_valid_user = true
WWW-Authenticate = Basic realm="couchdb"

[httpd]
WWW-Authenticate = Basic realm="couchdb"

[cors]
enable = true
credentials = true
origins = app://obsidian.md,capacitor://localhost,http://localhost
headers = accept, authorization, content-type, origin, referer, x-couchdb-any-error
methods = GET, PUT, POST, HEAD, DELETE
max_age = 600

[log]
level = info

