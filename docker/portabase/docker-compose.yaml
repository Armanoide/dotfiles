services:
  portabase_db:
    image: postgres:16-alpine
    container_name: portabase_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portabase_net
      - portabase_internal_net

  portabase:
    image: portabase/portabase:1.30.1
    container_name: portabase
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - TZ=${TZ}
    extra_hosts:
      # Self-fetch SSR via PROJECT_URL (auth-client.ts) : 192.168.32.1 = gateway du
      # bridge proxy_net ou tourne Traefik -> rejoint Traefik sans hairpin LAN
      # (bloque par le FW UGREEN). NE PAS utiliser host-gateway : il resout la
      # gateway du bridge par defaut (172.17.0.1) ou Traefik ne tourne pas.
      # Fix documente : tuto IT-Connect + issue Portabase #273/#412
      # - "db.backups.${DOMAIN}:192.168.32.1"
      - "db.backups.armanoide.net:192.168.32.1"
      - "s3.armanoide.net:host-gateway"
    volumes:
      - ./data:/data
    depends_on:
      portabase_db:
        condition: service_healthy
    networks:
      - proxy_net
      - portabase_net
      - portabase_internal_net
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portabase.rule=Host(`db.backups.${DOMAIN}`)"
      - "traefik.http.routers.portabase.entrypoints=https"
      - "traefik.http.routers.portabase.tls=true"
      - "traefik.http.routers.portabase.tls.certresolver=cloudflare"
      - "traefik.http.services.portabase.loadbalancer.server.port=80"

networks:
  proxy_net:
    external: true
  portabase_net:
    external: true
    name: portabase_net
  portabase_internal_net:
    internal: true
    name: portabase_internal_net
