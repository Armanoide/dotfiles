services:
  socket_proxy:
    container_name: socket_proxy
    image: lscr.io/linuxserver/socket-proxy:latest
    restart: unless-stopped
    ports:
      - "2375:2375"
    environment:
      ## Granted by Default
      - EVENTS=1
      - PING=1
      - VERSION=1
      ## Revoked by Default
      # Security critical
      - AUTH=0
      - SECRETS=0
      - POST=1 # Arcane and Watchtower
      # Not always needed
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1 # Traefik, Arcane, etc.
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=1 # Arcane
      - INFO=1 # Arcane
      - NETWORKS=1 # Arcane
      - NODES=0
      - PLUGINS=0
      - SERVICES=1 # Arcane
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=1 # Arcane
      - VOLUMES=1 # Arcane
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - proxy_net
    read_only: true
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true

networks:
  proxy_net:
    external: true
