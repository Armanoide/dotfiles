services:
  searxng_redis:
    container_name: searxng_redis
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng_net
    volumes:
      - searxng_redis:/data
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      searxng_net:
      proxy_net:
      vlan60_services:
        ipv4_address: ${SEARCH_IP}
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng_data:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  searxng_net:
  proxy_net:
    external: true
  vlan60_services:
    external: true

volumes:
  searxng_redis:
    name: searxng_redis
  searxng_data:
    name: searxng_data
