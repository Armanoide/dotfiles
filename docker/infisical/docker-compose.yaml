services:
  infisical:
    image: infisical/infisical:latest-postgres
    container_name: infisical
    restart: unless-stopped
    env_file: .env
    depends_on:
      infisical_postgres:
        condition: service_healthy
      infisical_redis:
        condition: service_started
    networks:
      - proxy_net
      - infisical_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.infisical.rule=Host(`infisical.${DOMAIN}`)"
      - "traefik.http.routers.infisical.entrypoints=https"
      - "traefik.http.routers.infisical.tls=true"
      - "traefik.http.routers.infisical.tls.certresolver=cloudflare"
      - "traefik.http.services.infisical.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  infisical_postgres:
    image: docker.io/postgres:15
    container_name: infisical_postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      - POSTGRES_USER=infisical
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=infisical_db
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    networks:
      - infisical_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  infisical_redis:
    image: docker.io/redis:7.2.5
    container_name: infisical_redis
    restart: unless-stopped
    networks:
      - infisical_net

networks:
  proxy_net:
    external: true
  infisical_net:
    name: infisical_net
    driver: bridge
