services:
  hindsight:
    image: hindsight:latest
    container_name: hindsight
    restart: unless-stopped
    env_file:
      - ./data/.env
    ports:
      - "8888:8888"
      - "9999:9999"
    volumes:
      - ./data:/home/hindsight/.pg0
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
