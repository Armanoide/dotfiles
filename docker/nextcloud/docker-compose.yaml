services:
  nextcloud_db:
    image: mariadb:lts
    container_name: nextcloud_db
    restart: always
    networks:
      - nextcloud_net
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - nextcloud_db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}

  nextcloud_redis:
    image: redis:alpine
    restart: always
    container_name: nextcloud_redis
    volumes:
      - nextcloud_redis:/data
    networks:
      - nextcloud_net

  nextcloud_app:
    image: nextcloud
    container_name: nextcloud_app
    restart: always
    networks:
      - proxy_net
      - nextcloud_net
    depends_on:
      - nextcloud_redis
      - nextcloud_db
    volumes:
      - ./html:/var/www/html
      - /volume1/NextCloud:/var/www/html/data
      - ./nextcloud.log:/var/www/html/data/nextcloud.log
      - ./${APP_FOLDER}:/var/www/html/data/${APP_FOLDER}
      - ./fix:/fix
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_HOST=nextcloud_db
      - REDIS_HOST=nextcloud_redis
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
      - OVERWRITEPROTOCOL=https
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`cloud.${DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=https"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.tls.certresolver=cloudflare"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
      # Middlewares pour corriger les avertissements CalDAV/CardDAV de Nextcloud
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-dav"
      - "traefik.http.middlewares.nextcloud-dav.redirectregex.regex=^https://(.*)/.well-known/(card|cal)dav"
      - "traefik.http.middlewares.nextcloud-dav.redirectregex.replacement=https://$$1/remote.php/dav/"

volumes:
  nextcloud:
  nextcloud_db:
  nextcloud_redis:
    name: nextcloud_redis

networks:
  proxy_net:
    external: true
  nextcloud_net:
      driver: bridge
