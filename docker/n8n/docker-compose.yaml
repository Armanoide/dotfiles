services:
  n8n_db:
    image: postgres:18
    container_name: n8n_db
    restart: on-failure:5
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      timeout: 45s
      interval: 10s
      retries: 10
    volumes:
      - ./db:/var/lib/postgresql
    environment:
      TZ: Europe/Bucharest
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    networks:
      - n8n_net
      - databases_net
  n8n:
    container_name: n8n
    user: root
    image: docker.io/n8nio/n8n:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3014:5678"
    environment:
      # - UID=${UID}
      # - GID=${GID}
      - N8N_HOST=n8n.${DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.${DOMAIN}/
      - N8N_ENCRYPTION_KEY=${N8N_SECRET}
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
      - NODE_ENV=production
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${DB_NAME}
      - DB_POSTGRESDB_HOST=n8n_db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${DB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_PASS}
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_PRUNE_TIMEOUT=3600
      - EXECUTIONS_DATA_MAX_AGE=24
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50
      - N8N_FEATURE_FLAG_MCP=true
      - WEBHOOK_SECRET=retinal-tranquil-radial-rack
    volumes:
      - ./data:/root/.n8n
      # - ./data:/home/node/.n8n
      - ./files:/files

    networks:
      - proxy_net
      - n8n_net
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)"
    #   - "traefik.http.routers.n8n.entrypoints=https"
    #   - "traefik.http.routers.n8n.tls=true"
    #   - "traefik.http.routers.n8n.tls.certresolver=cloudflare"
    #   - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    #   - "traefik.http.middlewares.n8n.headers.SSLRedirect=true"
    #   - "traefik.http.middlewares.n8n.headers.STSSeconds=315360000"
    #   - "traefik.http.middlewares.n8n.headers.browserXSSFilter=true"
    #   - "traefik.http.middlewares.n8n.headers.contentTypeNosniff=true"
    #   - "traefik.http.middlewares.n8n.headers.forceSTSHeader=true"
    #   - "traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN}"
    #   - "traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true"
    #   - "traefik.http.middlewares.n8n.headers.STSPreload=true"
    #   - "traefik.http.routers.n8n.middlewares=n8n@docker"

  # --- n8n sandbox service (Assistant) ---
  n8n_sandbox_certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.14.0
    container_name: n8n_sandbox_certs
    user: '0:0'
    entrypoint: ["sh", "-c"]
    command:
      - >-
        bootstrap-mtls.sh --out-dir /tls --api-san n8n_sandbox_api
        --control-sans n8n_sandbox_runner,localhost &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - n8n_sandbox_tls:/tls
    networks:
      - n8n_net

  n8n_sandbox_api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.14.0
    container_name: n8n_sandbox_api
    restart: unless-stopped
    depends_on:
      n8n_sandbox_certs:
        condition: service_completed_successfully
    env_file: .env.sandbox
    environment:
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: n8n_sandbox_runner
    volumes:
      - n8n_sandbox_tls:/tls:ro
    ports:
      - "3019:8080"
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks:
      - n8n_net

  n8n_sandbox_runner:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:1.14.0
    container_name: n8n_sandbox_runner
    restart: unless-stopped
    privileged: true
    depends_on:
      n8n_sandbox_api:
        condition: service_healthy
    env_file: .env.sandbox
    environment:
      SANDBOX_RUNNER_API_GRPC_ADDR: n8n_sandbox_api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://n8n_sandbox_runner:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: n8n_sandbox_runner:9091
      SANDBOX_RUNNER_ID: n8n_sandbox_runner
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:1.14.0
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: n8n_sandbox_api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - n8n_sandbox_tls:/tls:ro
    networks:
      - n8n_net

volumes:
  n8n_sandbox_tls:

networks:
  databases_net:
    external: true
  proxy_net:
    external: true
  n8n_net:
    name: n8n_net
