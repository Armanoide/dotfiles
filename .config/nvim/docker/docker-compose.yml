services:
  nvim_editor:
    container_name: nvim_editor
    build:
      context: .
      args:
        CONTAINER_UID: ${CONTAINER_UID}
        CONTAINER_GID: ${CONTAINER_GID}
    volumes:
      - /:/internal_volume:rw
      # nvim config for root (--root mode)
      - ${NVIM_CONFIG_HOST}:/root/.config/nvim
      # nvim config for nvim user (default mode)
      - ${NVIM_CONFIG_HOST}:/home/nvim/.config/nvim
    privileged: true
    stdin_open: true
    tty: true
    network_mode: host
    restart: unless-stopped
    environment:
      IDLE_TIMEOUT: "7200"
      CHECK_INTERVAL: "5"
      STOP_GRACE: "15"
      PROTECT_MODIFIED: "1"
    healthcheck:
      test: ["CMD", "/usr/local/bin/editor-manager", "health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
