# ----------------------------------------
# Core Terminal & Color Settings
# ----------------------------------------
# Fix messed up keybindings
set-option -g xterm-keys on

# Set a safe default terminal inside tmux
set -g default-terminal "tmux-256color"

# Enable 256-color mode (truecolor) in general
set -g terminal-overrides '*:Tc'

# Enable 256-color mode specifically for Ghostty terminal
set -ga terminal-overrides ",ghostty*:Tc"

# Add support for underline styles (Smulx) and underline colors (Setulc)
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Allow passthrough for Kitty graphics
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Stop rename of terminal window title when assigined title
# set-option -g allow-rename off
# set-option -g automatic-rename off

# ----------------------------------------
# Prefix & Keybindings
# ----------------------------------------
# Change prefix key from C-b to C-Space
unbind C-b
set -g prefix C-Space

# Reload tmux config with Ctrl+Space + r
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

# Vim style pane selection (Ctrl+Space + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Ctrl+Space + Arrow (5 units)
bind Up     resize-pane -U 5
bind Down   resize-pane -D 5
bind Left   resize-pane -L 5
bind Right  resize-pane -R 5

# Support for Ghostty Cmd+Shift+H/L sending prefix+H/L (Window switching)
bind C-H previous-window
bind C-L next-window

# Split panes like Vim (Ctrl+Space + | or -)
bind | split-window -h
bind - split-window -v

# ----------------------------------------
# General Options
# ----------------------------------------
set -g base-index 1           # start indexing windows at 1 instead of 0
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g detach-on-destroy off  # don't exit from tmux when closing a session
set -g escape-time 0          # zero-out escape time delay
set -g history-limit 1000000  # increase history size (from 2,000)
set -g renumber-windows on    # renumber all windows when any window is closed
set -g set-clipboard on       # use system clipboard
set -g status-position top    # macOS / darwin style
setw -g mode-keys vi          # Vim keys for copy mode

# Set Status Line Lengths before plugin configs
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right ""

set -g status-left "#{E:@catppuccin_status_session}"

set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"


# ----------------------------------------
# Plugin Configuration
# ----------------------------------------
# @thumbs trigger manually
# copy to clipboard: prefix + f
set -g @thumbs-key 'f'
# paste from thumbs: prefix + v
bind-key v run "tmux load-buffer - && tmux paste-buffer -r"

# tmux-fzf-url options
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="    " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# tmux-resurrect/continuum options
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-dir '~/.tmux/resurrect'

# Catppuccin Theme Configuration (Modules and appearance)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_flags "icon"
set -g window-status-separator " " # Add padding between numbers/text

# Window Styling
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"            # Background color of current number segment
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"          # Foreground color of current window text
set -g @catppuccin_window_current_text " #{b:pane_current_path}#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_text " #{b:pane_current_path}"

# Status Line Separators and General Module Styling
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_module_bg_color "#{@thm_surface_0}"

# ----------------------------------------
# Plugin
# ----------------------------------------
# List of plugins using TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'Armanoide/catppuccin-tmux#main'


# ----------------------------------------
# Initialize TPM
# ----------------------------------------
run '~/.tmux/plugins/tpm/tpm'


# ----------------------------------------
# Override Status Line Background
# ----------------------------------------
set -g status-bg default
set -g status-style bg=default
